# Official Testsmith Practice Software Testing (Toolshop v5) Docker Compose Environment
# Usage: npm run docker:up && npm run test:docker
services:
  mysql:
    image: mysql:8.0
    container_name: toolshop-mysql
    environment:
      MYSQL_DATABASE: toolshop
      MYSQL_USER: toolshop
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: testsmith/practice-software-testing-api:latest
    container_name: toolshop-api
    ports:
      - "8091:80"
    environment:
      DB_HOST: mysql
      DB_DATABASE: toolshop
      DB_USERNAME: toolshop
      DB_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: testsmith/practice-software-testing-web:latest
    container_name: toolshop-web
    ports:
      - "4200:80"
    environment:
      API_URL: http://localhost:8091
    depends_on:
      - api
